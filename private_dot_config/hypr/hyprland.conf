# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor=DP-3, 3840x2160@60, 0x0, 1, bitdepth, 10
monitor=DP-2, 3840x2160@60, -3840x0, 1, bitdepth, 10
monitor=, highres, auto, 1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = uwsm app -- footclient
$menu = uwsm app -- fuzzel
$screenshot = uwsm app -- hyprshot

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = hyprpm reload -n
exec-once = uwsm app -- nm-applet
exec-once = uwsm app -- /usr/lib/polkit-kde-authentication-agent-1
exec-once = uwsm app -- fcitx5 -d --replace
exec-once = uwsm app -- udiskie
# exec-once = mako
# exec-once = waybar
# exec-once = hyprpaper
# exec-once = hypridle
# exec-once = foot --server

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
# Environment variables are managed by uwsm.

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
  gaps_in = 0
  gaps_out = 0

  border_size = 1

  # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)

  # Set to true enable resizing windows by clicking and dragging on borders and gaps
  resize_on_border = true

  # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
  allow_tearing = false

  layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 2

  # Change transparency of focused and unfocused windows
  active_opacity = 1.0
  inactive_opacity = 1.0

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  # https://wiki.hyprland.org/Configuring/Variables/#blur
  blur {
    enabled = true
    size = 3
    passes = 1

    vibrancy = 0.1696
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
  enabled = true

  # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

  bezier = easeOutQuint,0.23,1,0.32,1
  bezier = easeInOutCubic,0.65,0.05,0.36,1
  bezier = linear,0,0,1,1
  bezier = almostLinear,0.5,0.5,0.75,1.0
  bezier = quick,0.15,0,0.1,1

  animation = global, 1, 10, default
  animation = border, 1, 5.39, easeOutQuint
  animation = windows, 1, 4.79, easeOutQuint
  animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
  animation = windowsOut, 1, 1.49, linear, popin 87%
  animation = fadeIn, 1, 1.73, almostLinear
  animation = fadeOut, 1, 1.46, almostLinear
  animation = fade, 1, 3.03, quick
  animation = layers, 1, 3.81, easeOutQuint
  animation = layersIn, 1, 4, easeOutQuint, fade
  animation = layersOut, 1, 1.5, linear, fade
  animation = fadeLayersIn, 1, 1.79, almostLinear
  animation = fadeLayersOut, 1, 1.39, almostLinear
  animation = workspaces, 1, 1.94, almostLinear, fade
  animation = workspacesIn, 1, 1.21, almostLinear, fade
  animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
  # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  pseudotile = true
  preserve_split = true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
  new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
  force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options = ctrl:nocaps
  kb_rules =
  numlock_by_default = true

  repeat_rate = 40
  repeat_delay = 200

  follow_mouse = 1

  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

  touchpad {
    natural_scroll = false
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#cursor
cursor {
  no_hardware_cursors = 2
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
  workspace_swipe = false
}

# https://wiki.hyprland.org/Configuring/Variables/#group
group {
  groupbar {
    render_titles = false
    keep_upper_gap = false
    col.active = 0xffffff00
    col.inactive = 0xff777700
    gaps_in = 4
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#ecosystem
ecosystem {
  enforce_permissions = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# device {
#   name = epic-mouse-v1
#   sensitivity = -0.5
# }

####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, killactive,
bind = $mainMod, T, exec, $terminal
bind = $mainMod, grave, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, F, fullscreen,

# group
bind = $mainMod, J, togglegroup
bind = $mainMod, R, layoutmsg, togglesplit

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces relatively
bind = $mainMod, bracketleft, workspace, e-1
bind = $mainMod, bracketright, workspace, e+1
bind = $mainMod, Prior, workspace, e-1
bind = $mainMod, Next, workspace, e+1

# Switch and bring workspaces to the current monitor
# Similar to focusworkspaceoncurrentmonitor but:
# - It won't swap the current worksace to another monitor.
# - It can bring workspaces even if workspace rules have bindings.
bind = $mainMod ALT, 1, moveworkspacetomonitor, 1 current
bind = $mainMod ALT, 1, workspace, 1
bind = $mainMod ALT, 2, moveworkspacetomonitor, 2 current
bind = $mainMod ALT, 2, workspace, 2
bind = $mainMod ALT, 3, moveworkspacetomonitor, 3 current
bind = $mainMod ALT, 3, workspace, 3
bind = $mainMod ALT, 4, moveworkspacetomonitor, 4 current
bind = $mainMod ALT, 4, workspace, 4
bind = $mainMod ALT, 5, moveworkspacetomonitor, 5 current
bind = $mainMod ALT, 5, workspace, 5
bind = $mainMod ALT, 6, moveworkspacetomonitor, 6 current
bind = $mainMod ALT, 6, workspace, 6
bind = $mainMod ALT, 7, moveworkspacetomonitor, 7 current
bind = $mainMod ALT, 7, workspace, 7
bind = $mainMod ALT, 8, moveworkspacetomonitor, 8 current
bind = $mainMod ALT, 8, workspace, 8
bind = $mainMod ALT, 9, moveworkspacetomonitor, 9 current
bind = $mainMod ALT, 9, workspace, 9
bind = $mainMod ALT, 0, moveworkspacetomonitor, 10 current
bind = $mainMod ALT, 0, workspace, 10

# Monitor related movement
bind = $mainMod ALT, left, focusmonitor, l
bind = $mainMod ALT, down, focusmonitor, d
bind = $mainMod ALT, up, focusmonitor, u
bind = $mainMod ALT, right, focusmonitor, r

bind = $mainMod ALT SHIFT, left, movecurrentworkspacetomonitor, l
bind = $mainMod ALT SHIFT, down, movecurrentworkspacetomonitor, d
bind = $mainMod ALT SHIFT, up, movecurrentworkspacetomonitor, u
bind = $mainMod ALT SHIFT, right, movecurrentworkspacetomonitor, r

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Lock screen
bind = $mainMod, L, exec, loginctl lock-session

# screenshot
bind = , Print, exec, $screenshot -m region --clipboard-only
bind = SHIFT , Print, exec, $screenshot -m window -m active --clipboard-only
bind = $mainMod, Print, exec, $screenshot -m region
bind = $mainMod SHIFT, Print, exec, $screenshot -m window -m active

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Remove border for single window.
# https://wiki.hyprland.org/Configuring/Workspace-Rules/#smart-gaps
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = workspace 2,class:^(discord)$

workspace = 1, monitor:DP-3, persistent:true, default:true
workspace = 2, monitor:DP-3, persistent:true
workspace = 3, monitor:DP-3, persistent:true
workspace = 10, monitor:DP-2, persistent:true, default:true
workspace = special:magic, on-created-empty:$terminal

###################
### PERMISSIONS ###
###################

# https://wiki.hyprland.org/Configuring/Permissions/
permission = /usr/bin/grim, screencopy, allow
permission = /usr/lib/xdg-desktop-portal-hyprland, screencopy, allow

